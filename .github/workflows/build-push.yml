name: build-and-push-docker 
on: 
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/**'
        paths:
            - '!k8s/**'  # Exclude the k8s folder

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2

            - name: Login to Docker
              uses: docker/login-action@v3.4.0
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PAT }}

            - name: Docker Build For Testing
              uses: docker/build-push-action@v6.18.0
              with:
                context: .
                push: true 
                tags: ${{ vars.DOCKERHUB_USERNAME }}/to-do:${{ github.sha }}
    update-gitops:
      needs: build-and-push
      runs-on: ubuntu-latest
      steps:
        - name: Checkout GitOps repo
          uses: actions/checkout@v4
          with:
            repository: Salieri20/k8s-todo-deploy
            token: ${{ secrets.GITOPS_TOKEN }}
            path: gitops
    
        - name: Update deployment image tag
          env:
            DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          run: |
            TAG=${GITHUB_SHA}
            FILE=gitops/app-deployment.yaml
            sed -i "s|image: .*/to-do:.*|image: ${DOCKERHUB_USERNAME}/to-do:${TAG}|" $FILE
            
    
        - name: Commit and push change
          run: |
            cd gitops
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .
            git commit -m "Update image tag to ${GITHUB_SHA}"
            git push
